name: native-audio-core

# Builds the optional C core of the OPL2 emulator (extractor/_opl2c.c) on every
# platform and runs the native-vs-numpy equivalence test (the rest of the suite needs
# the original UGH.EXE).  The release workflow bundles the library into the standalone
# builds.  Without the library the extractor still works (numpy fallback, identical
# audio, ~10x slower).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64,   os: ubuntu-latest,    lib: _opl2c.so,    flags: ''}
          - {name: linux-arm64, os: ubuntu-24.04-arm, lib: _opl2c.so,    flags: ''}
          - {name: macos,       os: macos-latest,     lib: _opl2c.dylib, flags: --universal}
          - {name: windows-x64, os: windows-latest,   lib: _opl2c.dll,   flags: ''}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Build native core
        run: python -m extractor.build_native ${{ matrix.flags }}
      # The other tests need the original UGH.EXE, which is not in the repository.
      - name: Tests (native core must match the numpy path)
        run: python -m pytest tests/test_opl2_native.py -q
      - name: Tests (numpy fallback only)
        run: python -m pytest tests/test_opl2_native.py -q
        env:
          PTERODRIVE_NO_NATIVE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: opl2c-${{ matrix.name }}
          path: extractor/${{ matrix.lib }}
          if-no-files-found: error
